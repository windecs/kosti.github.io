<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎃 Мистические 3D Кости 💀</title><style>body{font-family:'Courier New',Courier,monospace;text-align:center;background-color:#1a1a24;color:#ff7900;margin:0;padding:20px;background-image:radial-gradient(circle,#2c1a3a 0%,#0d0d13 100%);min-height:100vh;box-sizing:border-box;overflow-x:hidden;position:relative}.snowflake{position:fixed;top:-10px;color:#ff4500;font-size:1em;text-shadow:0 0 5px rgba(255,121,0,.6);user-select:none;z-index:1000;pointer-events:none;animation:fall linear infinite}@keyframes fall{0%{top:-10px;transform:translateX(0) rotate(0deg);opacity:.8}100%{top:105vh;transform:translateX(80px) rotate(360deg);opacity:0}}h1{font-size:36px;text-shadow:0 0 10px #ff7900,0 0 20px #ff4500;margin-bottom:5px;position:relative;z-index:10}.subtitle{color:#888;margin-bottom:30px;font-style:italic;font-size:18px;position:relative;z-index:10}.controls{margin-bottom:40px;background:rgba(0,0,0,.4);padding:15px 25px;border-radius:10px;display:inline-block;border:1px solid #ff7900;box-shadow:0 0 15px rgba(255,121,0,.2);position:relative;z-index:10}label{font-size:18px;margin-right:12px;color:#bbb}select{padding:10px;font-size:16px;background-color:#222;color:#ff7900;border:1px solid #ff7900;border-radius:5px;outline:none;cursor:pointer}button{padding:10px 25px;font-size:18px;background:linear-gradient(135deg,#ff4500,#ff7900);color:#000;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin-left:15px;text-transform:uppercase;box-shadow:0 0 10px #ff4500;transition:all .2s ease}button:hover{transform:scale(1.05);box-shadow:0 0 20px #ff7900}button:disabled{background:#444;color:#888;box-shadow:none;cursor:not-allowed;transform:none}#dice-wrapper{display:flex;justify-content:center;flex-wrap:wrap;gap:50px;max-width:900px;margin:40px auto;perspective:1000px;position:relative;z-index:10}.scene{width:100px;height:100px;transition:transform .4s ease}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.25,1,.5,1)}@keyframes bounceUpAndDown{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-80px) scale(1.1)}70%{transform:translateY(20px) scale(.95)}100%{transform:translateY(0) scale(1)}}.cube__face{position:absolute;width:100px;height:100px;background:#2b2b36;border:2px solid #ff7900;border-radius:10px;font-size:45px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 20px rgba(0,0,0,.8),0 0 15px rgba(255,121,0,.3);box-sizing:border-box;backface-visibility:visible}.cube__face--1{transform:rotateY(0deg) translateZ(50px)}.cube__face--6{transform:rotateX(180deg) translateZ(50px)}.cube__face--3{transform:rotateY(90deg) translateZ(50px)}.cube__face--4{transform:rotateY(-90deg) translateZ(50px)}.cube__face--2{transform:rotateX(90deg) translateZ(50px)}.cube__face--5{transform:rotateX(-90deg) translateZ(50px)}#result{font-size:26px;font-weight:bold;color:#00ffcc;text-shadow:0 0 10px #00ffcc;margin-top:30px;min-height:60px;line-height:1.5;position:relative;z-index:10}</style></head><body><h1>🎃 Жуткие 3D Кости 💀</h1><div class="subtitle">Испытай свою хэллоуинскую удачу... если не боишься!</div><div class="controls"><label for="dice-count">Сколько проклятых костей бросить?</label><select id="dice-count" onchange="initDice()"><option value="1">1 кость</option><option value="2" selected>2 кости</option><option value="3">3 кости</option><option value="4">4 кости</option><option value="5">5 костей</option></select><button id="roll-btn" onclick="rollAllDice()">Испытать кости!</button></div><div id="dice-wrapper"></div><div id="result">Призови духов, чтобы начать бросок!</div><script>const faceRotations={1:{x:0,y:0},6:{x:180,y:0},3:{x:0,y:-90},4:{x:0,y:90},2:{x:-90,y:0},5:{x:90,y:0}};function createSnowfall(){const e=40;for(let t=0;t<e;t++){const e=document.createElement("div");e.className="snowflake",e.textContent=["🔸","🍁","💀","✨"][Math.floor(4*Math.random())],e.style.left=100*Math.random()+"vw",e.style.animationDuration=3*Math.random()+2+"s",e.style.animationDelay=5*Math.random()+"s",e.style.fontSize=1.2*Math.random()+.5+"em",document.body.appendChild(e)}}function initDice(){const e=document.getElementById("dice-count"),t=e?parseInt(e.value):2,n=document.getElementById("dice-wrapper");if(n){n.innerHTML="";for(let e=0;e<t;e++){const t=document.createElement("div");t.className="scene",t.id=`scene-${e}`,t.innerHTML=`<div id="cube-${e}" class="cube"><div class="cube__face cube__face--1">🎃</div><div class="cube__face cube__face--2">GMT</div><div class="cube__face cube__face--3">🦇</div><div class="cube__face cube__face--4">🕷️</div><div class="cube__face cube__face--5">🧙‍♀️</div><div class="cube__face cube__face--6">💀</div></div>`,t.querySelector(".cube__face--2").textContent="👻",n.appendChild(t)}document.getElementById("result").textContent="Кости ждут твоего прикосновения...",document.getElementById("result").style.color="#00ffcc",document.getElementById("result").style.textShadow="0 0 10px #00ffcc"}}function rollAllDice(){const e=document.getElementById("dice-count"),t=e?parseInt(e.value):2,n=document.getElementById("roll-btn");n&&(n.disabled=!0),document.getElementById("result").textContent="Духи крутят кости...",document.getElementById("result").style.color="#ff7900",document.getElementById("result").style.textShadow="0 0 10px #ff7900";let l=0;for(let e=0;e<t;e++){const t=document.getElementById(`cube-${e}`),n=document.getElementById(`scene-${e}`);if(!t||!n)continue;const a=Math.floor(6*Math.random())+1;l+=a,n.style.animation="none",void n.offsetWidth,n.style.animation="bounceUpAndDown 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards";const o=360*(Math.floor(4*Math.random())+3),c=360*(Math.floor(4*Math.random())+3),s=faceRotations[a].x+o,i=faceRotations[a].y+c;t.style.transform=`rotateX(${s}deg) rotateY(${i}deg)`}setTimeout(()=>{let e="";e=l===6*t?"🔥 Абсолютное проклятие! (Максимум!) 💀":l===1*t?"🕸️ Конфет не будет... (Минимум) 🕷️":"🔮 Сумрачная сила сулит мистические тайны!",document.getElementById("result").innerHTML=`Выпало очков: ${l} <br> <span style="font-size: 18px; color: #ff4500;">${e}</span>`,document.getElementById("result").style.color="#00ffcc",document.getElementById("result").style.textShadow="0 0 10px #00ffcc",n&&(n.disabled=!1)},1800)}document.addEventListener("DOMContentLoaded", Freemason=>{createSnowfall(),initDice()});</script></body></html>
