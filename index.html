<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Мистические Хэллоуинские Кости 💀</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            background-color: #1a1a24; /* Мрачный темно-фиолетовый фон */
            color: #ff7900; /* Ярко-оранжевый хэллоуинский цвет */
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle, #2c1a3a 0%, #0d0d13 100%);
        }
        h1 {
            font-size: 36px;
            text-shadow: 0 0 10px #ff7900, 0 0 20px #ff4500;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        /* Меню управления */
        .controls {
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ff7900;
            box-shadow: 0 0 15px rgba(255, 121, 0, 0.2);
        }
        label {
            font-size: 18px;
            margin-right: 10px;
            color: #bbb;
        }
        select {
            padding: 10px;
            font-size: 16px;
            background-color: #222;
            color: #ff7900;
            border: 1px solid #ff7900;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        button {
            padding: 10px 25px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff4500, #ff7900);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 15px;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff4500;
            transition: all 0.2s ease;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff7900;
        }
        button:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Поле для кубиков */
        #dice-wrapper {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 50px;
            max-width: 900px;
            margin: 40px auto;
            perspective: 800px;
        }

        /* 3D Сцена */
        .scene {
            width: 100px;
            height: 100px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Мрачные грани кубика */
        .cube__face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #2b2b36;
            border: 2px solid #ff7900;
            border-radius: 10px;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,121,0,0.3);
            box-sizing: border-box;
            backface-visibility: visible;
        }

        /* Развертка кубика в 3D */
        .cube__face--1 { transform: rotateY(  0deg) translateZ(50px); }
        .cube__face--6 { transform: rotateX(180deg) translateZ(50px); }
        .cube__face--3 { transform: rotateY( 90deg) translateZ(50px); }
        .cube__face--4 { transform: rotateY(-90deg) translateZ(50px); }
        .cube__face--2 { transform: rotateX( 90deg) translateZ(50px); }
        .cube__face--5 { transform: rotateX(-90deg) translateZ(50px); }

        /* Панель результатов */
        #result {
            font-size: 26px;
            font-weight: bold;
            color: #00ffcc; /* Магическое неоновое свечение для баланса */
            text-shadow: 0 0 10px #00ffcc;
            margin-top: 30px;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <h1>🎃 Жуткие 3D Кости 💀</h1>
    <div class="subtitle">Испытай свою хэллоуинскую удачу... если не боишься!</div>

    <div class="controls">
        <label for="dice-count">Сколько проклятых костей бросить?</label>
        <select id="dice-count" onchange="initDice()">
            <option value="1">1 кость</option>
            <option value="2" selected>2 кости</option>
            <option value="3">3 кости</option>
            <option value="4">4 кости</option>
            <option value="5">5 костей</option>
        </select>
        <button id="roll-btn" onclick="rollAllDice()">Испытать рок!</button>
    </div>

    <div id="dice-wrapper"></div>

    <div id="result">Призови духов, чтобы начать бросок!</div>

    <script>
        // Соответствие силы кости и хэллоуинских символов
        const halloweenIcons = {
            1: "🎃", // Тыква
            2: "👻", // Привидение
            3: "BAT", // Сюда подставим 🦇 в HTML
            4: "SPID", // Сюда 🕷️
            5: "WITCH", // Сюда 🧙‍♀️
            6: "💀"  // Череп
        };

        // Координаты вращения граней
        const faceRotations = {
            1: { x: 0,   y: 0 },
            6: { x: 180, y: 0 },
            3: { x: 0,   y: -90 },
            4: { x: 0,   y: 90 },
            2: { x: -90, y: 0 },
            5: { x: 90,  y: 0 }
        };

        // Генерация кубиков
        function initDice() {
            const count = parseInt(document.getElementById('dice-count').value);
            const wrapper = document.getElementById('dice-wrapper');
            wrapper.innerHTML = ''; 

            for (let i = 0; i < count; i++) {
                const scene = document.createElement('div');
                scene.className = 'scene';
                scene.innerHTML = `
                    <div id="cube-${i}" class="cube">
                        <div class="cube__face cube__face--1">🎃</div>
                        <div class="cube__face cube__face--2">👻</div>
                        <div class="cube__face cube__face--3">🦇</div>
                        <div class="cube__face cube__face--4">🕷️</div>
                        <div class="cube__face cube__face--5">🧙‍♀️</div>
                        <div class="cube__face cube__face--6">💀</div>
                    </div>
                `;
                wrapper.appendChild(scene);
            }
            document.getElementById('result').textContent = 'Кости ждут твоего прикосновения...';
            document.getElementById('result').style.color = '#00ffcc';
            document.getElementById('result').style.textShadow = '0 0 10px #00ffcc';
        }

        // Бросок
        function rollAllDice() {
            const count = parseInt(document.getElementById('dice-count').value);
            const button = document.getElementById('roll-btn');
            button.disabled = true; 

            document.getElementById('result').textContent = 'Духи крутят кости...';
            document.getElementById('result').style.color = '#ff7900';
            document.getElementById('result').style.textShadow = '0 0 10px #ff7900';

            let totalSum = 0;

            for (let i = 0; i < count; i++) {
                const cube = document.getElementById(`cube-${i}`);
                const randomValue = Math.floor(Math.random() * 6) + 1;
                totalSum += randomValue;

                // Увеличили силу и непредсказуемость вращения (добавили дикие обороты)
                const extraTurnsX = (Math.floor(Math.random() * 4) + 3) * 360;
                const extraTurnsY = (Math.floor(Math.random() * 4) + 3) * 360;

                const finalX = faceRotations[randomValue].x + extraTurnsX;
                const finalY = faceRotations[randomValue].y + extraTurnsY;

                cube.style.transform = `rotateX(${finalX}deg) rotateY(${finalY}deg)`;
            }

            // Время анимации чуть увеличено для саспенса (1.8 секунды)
            setTimeout(() => {
                let atmosphericMessage = '';
                if (totalSum === count * 6) {
                    atmosphericMessage = ' 🩸 Абсолютное проклятие! (Максимум!)';
                } else if (totalSum === count * 1) {
                    atmosphericMessage = ' 🕸️ Конфет не будет... (Минимум)';
                } else {
                    atmosphericMessage = ' 🔮 Сумрачная сила!';
                }

                document.getElementById('result').innerHTML = `Выпало очков: ${totalSum} <br> <span style="font-size: 18px; color: #ff4500;">${atmosphericMessage}</span>`;
                button.disabled = false;
            }, 1800);
        }

        // Запуск при загрузке
        initDice();
    </script>

</body>
</html>
