<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Жуткие 3D Кости 💀</title>
    <style>
        body { font-family: 'Courier New', monospace; text-align: center; background: radial-gradient(circle, #2c1a3a 0%, #0d0d13 100%); color: #ff7900; margin: 0; padding: 20px; min-height: 100vh; overflow-x: hidden; position: relative; }
        .theme-btn { position: absolute; top: 0; left: 0; width: 120px; height: 80px; background: transparent; border: none; cursor: pointer; z-index: 100; }
        
        /* Стили для хэллоуинского листопада */
        .particle { position: fixed; top: -20px; font-size: 1.5em; user-select: none; z-index: 1000; pointer-events: none; animation: fall linear infinite; }
        @keyframes fall { 0% { top: -20px; transform: translateX(0) rotate(0deg); opacity: 0.8; } 100% { top: 105vh; transform: translateX(100px) rotate(360deg); opacity: 0; } }
        
        .controls { margin-bottom: 40px; background: rgba(0, 0, 0, 0.4); padding: 15px 25px; border-radius: 10px; display: inline-block; border: 1px solid #ff7900; }
        select, button#roll-btn { padding: 9px 20px; font-size: 16px; border-radius: 8px; background: #222; color: #ff7900; border: 1px solid #ff7900; cursor: pointer; }
        button#roll-btn { background: linear-gradient(135deg, #ff4500, #ff7900); color: #000; font-weight: bold; margin-left: 15px; }
        #dice-wrapper { display: flex; justify-content: center; gap: 50px; margin: 40px auto; perspective: 1000px; min-height: 140px; }
        .scene { width: 100px; height: 100px; display: inline-block; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-80px); } 70% { transform: translateY(20px); } }
        .cube__face { position: absolute; width: 100px; height: 100px; background: #2b2b36; border: 2px solid #ff7900; border-radius: 10px; font-size: 45px; display: flex; align-items: center; justify-content: center; backface-visibility: visible; }
        .cube__face--1 { transform: rotateY(0deg) translateZ(50px); } .cube__face--6 { transform: rotateX(180deg) translateZ(50px); } .cube__face--3 { transform: rotateY(90deg) translateZ(50px); } .cube__face--4 { transform: rotateY(-90deg) translateZ(50px); } .cube__face--2 { transform: rotateX(90deg) translateZ(50px); } .cube__face--5 { transform: rotateX(-90deg) translateZ(50px); }
        #result { font-size: 26px; font-weight: bold; margin-top: 50px; color: #00ffcc; }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="goToDispatcher()"></button>
    <h1>🎃 Жуткие 3D Кости</h1>
    <div class="controls">
        <label>Кости: </label>
        <select id="dice-count" onchange="initDice()"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
        <button id="roll-btn" onclick="rollAllDice()">Испытать рок!</button>
    </div>
    <div id="dice-wrapper"></div>
    <div id="result">Призови духов...</div>
    <script>
        function goToDispatcher() { window.location.href = "1index.html"; }
        const r = {1:{x:0,y:0},6:{x:180,y:0},3:{x:0,y:-90},4:{x:0,y:90},2:{x:-90,y:0},5:{x:90,y:0}};
        
        function createParticles() {
            const parts = ["🔸", "🍁", "💀", "✨", "🍂"];
            for(let i=0; i<40; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.textContent = parts[Math.floor(Math.random() * parts.length)];
                p.style.left = (Math.random() * 100) + "vw";
                p.style.animationDuration = (Math.random() * 3 + 2) + "s";
                p.style.animationDelay = (Math.random() * 5) + "s";
                p.style.fontSize = (Math.random() * 1.2 + 0.5) + "em";
                document.body.appendChild(p);
            }
        }

        function initDice() {
            const c = parseInt(document.getElementById("dice-count").value), w = document.getElementById("dice-wrapper");
            w.innerHTML = "";
            for(let i=0;i<c;i++) {
                w.innerHTML += `<div class="scene" id="sc-${i}"><div id="cube-${i}" class="cube">
                <div class="cube__face cube__face--1">🎃</div><div class="cube__face cube__face--2">👻</div>
                <div class="cube__face cube__face--3">🦇</div><div class="cube__face cube__face--4">🕷️</div>
                <div class="cube__face cube__face--5">🧙‍♀️</div><div class="cube__face cube__face--6">💀</div></div></div>`;
            }
        }
        function rollAllDice() {
            const c = parseInt(document.getElementById("dice-count").value); let t = 0;
            for(let i=0;i<c;i++) {
                const cube = document.getElementById(`cube-${i}`), sc = document.getElementById(`sc-${i}`), v = Math.floor(Math.random()*6)+1; t+=v;
                sc.style.animation = "none"; void sc.offsetWidth; sc.style.animation = "bounce 1.2s forwards";
                cube.style.transform = `rotateX(${r[v].x + (Math.floor(Math.random()*4)+3)*360}deg) rotateY(${r[v].y + (Math.floor(Math.random()*4)+3)*360}deg)`;
            }
            setTimeout(() => { document.getElementById("result").innerHTML = `Выпало: ${t} очков`; }, 1600);
        }
        createParticles();
        initDice();
    </script>
</body>
</html>
