<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Классические 3D Кости 🎲</title><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;text-align:center;background-color:#1e293b;color:#f8fafc;margin:0;padding:20px;background-image:radial-gradient(circle,#334155 0%,#0f172a 100%);min-height:100vh;box-sizing:border-box;overflow-x:hidden;position:relative}.bg-particle{position:fixed;top:-10px;color:rgba(255,255,255,.1);font-size:1.5em;user-select:none;z-index:1000;pointer-events:none;animation:fall linear infinite}@keyframes fall{0%{top:-10px;transform:translateX(0) rotate(0deg);opacity:.5}100%{top:105vh;transform:translateX(60px) rotate(360deg);opacity:0}}h1{font-size:38px;color:#fff;text-shadow:0 4px 6px rgba(0,0,0,.3);margin-bottom:5px;position:relative;z-index:10}.subtitle{color:#94a3b8;margin-bottom:30px;font-size:18px;position:relative;z-index:10}.controls{margin-bottom:40px;background:rgba(255,255,255,.05);padding:15px 25px;border-radius:12px;display:inline-block;border:1px solid #475569;backdrop-filter:blur(5px);box-shadow:0 4px 20px rgba(0,0,0,.2);position:relative;z-index:10}label{font-size:18px;margin-right:12px;color:#e2e8f0}select{padding:10px;font-size:16px;background-color:#1e293b;color:#f1f5f9;border:1px solid #475569;border-radius:6px;outline:none;cursor:pointer}button{padding:10px 25px;font-size:18px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-left:15px;box-shadow:0 4px 12px rgba(37,99,235,.3);transition:all .2s ease}button:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(37,99,235,.5);background:linear-gradient(135deg,#60a5fa,#2563eb)}button:disabled{background:#475569;color:#94a3b8;box-shadow:none;cursor:not-allowed;transform:none}#dice-wrapper{display:flex;justify-content:center;flex-wrap:wrap;gap:50px;max-width:900px;margin:40px auto;perspective:1000px;position:relative;z-index:10}.scene{width:100px;height:100px;transition:transform .4s ease}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.2,.8,.25,1)}@keyframes bounceUpAndDown{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-80px) scale(1.1)}70%{transform:translateY(20px) scale(.95)}100%{transform:translateY(0) scale(1)}}.cube__face{position:absolute;width:100px;height:100px;background:#fff;border:1px solid #cbd5e1;border-radius:16px;font-size:55px;display:flex;align-items:center;justify-content:center;color:#1e293b;box-shadow:inset 0 0 15px rgba(0,0,0,.1),0 4px 10px rgba(0,0,0,.2);box-sizing:border-box;backface-visibility:visible}.cube__face--1{transform:rotateY(0deg) translateZ(50px)}.cube__face--6{transform:rotateX(180deg) translateZ(50px)}.cube__face--3{transform:rotateY(90deg) translateZ(50px)}.cube__face--4{transform:rotateY(-90deg) translateZ(50px)}.cube__face--2{transform:rotateX(90deg) translateZ(50px)}.cube__face--5{transform:rotateX(-90deg) translateZ(50px)}#result{font-size:26px;font-weight:bold;color:#38bdf8;text-shadow:0 0 10px rgba(56,189,248,.2);margin-top:30px;min-height:60px;line-height:1.5;position:relative;z-index:10}</style></head><body><h1>🎲 Игральные 3D Кости 🎲</h1><div class="subtitle">Классический бросок кубиков на удачу!</div><div class="controls"><label for="dice-count">Сколько кубиков бросить?</label><select id="dice-count" onchange="initDice()"><option value="1">1 кубик</option><option value="2" selected>2 кубика</option><option value="3">3 кубика</option><option value="4">4 кубика</option><option value="5">5 кубиков</option></select><button id="roll-btn" onclick="rollAllDice()">Бросить! 🎲</button></div><div id="dice-wrapper"></div><div id="result">Нажмите кнопку, чтобы сделать бросок!</div><script>const faceRotations={1:{x:0,y:0},6:{x:180,y:0},3:{x:0,y:-90},4:{x:0,y:90},2:{x:-90,y:0},5:{x:90,y:0}};function createBackgroundParticles(){const e=30;for(let t=0;t<e;t++){const e=document.createElement("div");e.className="bg-particle",e.textContent="•",e.style.left=100*Math.random()+"vw",e.style.animationDuration=4*Math.random()+3+"s",e.style.animationDelay=5*Math.random()+"s",e.style.fontSize=2*Math.random()+.5+"em",document.body.appendChild(e)}}function initDice(){const e=document.getElementById("dice-count"),t=e?parseInt(e.value):2,n=document.getElementById("dice-wrapper");if(n){n.innerHTML="";for(let e=0;e<t;e++){const t=document.createElement("div");t.className="scene",t.id=`scene-${e}`,t.innerHTML=`<div id="cube-${e}" class="cube"><div class="cube__face cube__face--1">⚀</div><div class="cube__face cube__face--2">⚁</div><div class="cube__face cube__face--3">⚂</div><div class="cube__face cube__face--4">⚃</div><div class="cube__face cube__face--5">⚄</div><div class="cube__face cube__face--6">⚅</div></div>`,n.appendChild(t)}document.getElementById("result").textContent="Кубики готовы к броску",document.getElementById("result").style.color="#94a3b8",document.getElementById("result").style.textShadow="none"}}function rollAllDice(){const e=document.getElementById("dice-count"),t=e?parseInt(e.value):2,n=document.getElementById("roll-btn");n&&(n.disabled=!0),document.getElementById("result").textContent="Кубики перемешиваются... 🔄",document.getElementById("result").style.color="#38bdf8";let l=0;for(let e=0;e<t;e++){const t=document.getElementById(`cube-${e}`),n=document.getElementById(`scene-${e}`);if(!t||!n)continue;const a=Math.floor(6*Math.random())+1;l+=a,n.style.animation="none",void n.offsetWidth,n.style.animation="bounceUpAndDown 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards";const o=360*(Math.floor(4*Math.random())+3),c=360*(Math.floor(4*Math.random())+3),s=faceRotations[a].x+o,i=faceRotations[a].y+c;t.style.transform=`rotateX(${s}deg) rotateY(${i}deg)`}setTimeout(()=>{let e="";e=l===6*t?"🔥 Максимальный результат! Отличная игра! ✨":l===1*t?"👀 Минимальное число очков. Повезет в следующий раз!":"🎲 Хороший бросок!";document.getElementById("result").innerHTML=`Вы набрали: ${l} очков <br> <span style="font-size: 18px; color: #34d399;">${e}</span>`,document.getElementById("result").style.color="#38bdf8",n&&(n.disabled=!1)},1600)}document.addEventListener("DOMContentLoaded",(()=>{createBackgroundParticles(),initDice()}));</script></body></html>
