<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎄 Новогодние 3D Кости со Снегом ✨</title><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;text-align:center;background-color:#0b1d3a;color:#e0f2fe;margin:0;padding:20px;background-image:radial-gradient(circle,#1e3a8a 0%,#090d16 100%);min-height:100vh;box-sizing:border-box;overflow-x:hidden;position:relative}.snowflake{position:fixed;top:-10px;color:#fff;font-size:1em;font-family:Arial,sans-serif;text-shadow:0 0 5px rgba(255,255,255,.8);user-select:none;z-index:1000;pointer-events:none;animation:fall linear infinite}@keyframes fall{0%{top:-10px;transform:translateX(0) rotate(0deg);opacity:1}100%{top:105vh;transform:translateX(100px) rotate(360deg);opacity:.3}}h1{font-size:38px;color:#fff;text-shadow:0 0 10px #38bdf8,0 0 20px #0369a1;margin-bottom:5px;position:relative;z-index:10}.subtitle{color:#93c5fd;margin-bottom:30px;font-style:italic;font-size:18px;position:relative;z-index:10}.controls{margin-bottom:40px;background:rgba(255,255,255,.05);padding:15px 25px;border-radius:15px;display:inline-block;border:1px solid #38bdf8;backdrop-filter:blur(5px);box-shadow:0 0 20px rgba(56,189,248,.2);position:relative;z-index:10}label{font-size:18px;margin-right:12px;color:#f1f5f9}select{padding:10px;font-size:16px;background-color:#0f172a;color:#38bdf8;border:1px solid #38bdf8;border-radius:8px;outline:none;cursor:pointer}button{padding:10px 25px;font-size:18px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-left:15px;box-shadow:0 0 15px rgba(239,68,68,.4);transition:all .2s ease;text-shadow:1px 1px 2px rgba(0,0,0,.3)}button:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(239,68,68,.7);background:linear-gradient(135deg,#f87171,#dc2626)}button:disabled{background:#334155;color:#64748b;box-shadow:none;cursor:not-allowed;transform:none}#dice-wrapper{display:flex;justify-content:center;flex-wrap:wrap;gap:50px;max-width:900px;margin:40px auto;perspective:1000px;position:relative;z-index:10}.scene{width:100px;height:100px;transition:transform .4s ease}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.2,.8,.25,1)}@keyframes bounceUpAndDown{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-80px) scale(1.1)}70%{transform:translateY(20px) scale(.95)}100%{transform:translateY(0) scale(1)}}.cube__face{position:absolute;width:100px;height:100px;background:rgba(224,242,254,.85);border:2px solid #38bdf8;border-radius:14px;font-size:45px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 15px #fff,0 0 20px rgba(56,189,248,.4);box-sizing:border-box;backface-visibility:visible}.cube__face--1{transform:rotateY(0deg) translateZ(50px)}.cube__face--6{transform:rotateX(180deg) translateZ(50px)}.cube__face--3{transform:rotateY(90deg) translateZ(50px)}.cube__face--4{transform:rotateY(-90deg) translateZ(50px)}.cube__face--2{transform:rotateX(90deg) translateZ(50px)}.cube__face--5{transform:rotateX(-90deg) translateZ(50px)}#result{font-size:26px;font-weight:bold;color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.5);margin-top:30px;min-height:60px;line-height:1.5;position:relative;z-index:10}</style></head><body><h1>🎄 Новогодние 3D Кости ✨</h1><div class="subtitle">Бросьте волшебный лед под снегопадом!</div><div class="controls"><label for="dice-count">Сколько ледяных кубиков растопить?</label><select id="dice-count" onchange="initDice()"><option value="1">1 кубик</option><option value="2" selected>2 кубика</option><option value="3">3 кубика</option><option value="4">4 кубика</option><option value="5">5 кубиков</option></select><button id="roll-btn" onclick="rollAllDice()">Бросить лед! ❄️</button></div><div id="dice-wrapper"></div><div id="result">Загадайте желание и нажмите кнопку!</div><script>const faceRotations={1:{x:0,y:0} ${i}deg)`}setTimeout(()=>{let e="";e=l===6*t?"🎉 Невероятное чудо! Год будет максимально счастливым! 🌟":l===1*t?"❄️ Время слепить снеговика и верить в лучшее! 😊":"🎁 Снежная магия сулит отличные подарки!",document.getElementById("result").innerHTML=`Вы набрали: ${l} очков <br> <span style="font-size: 18px; color: #facc15;">${e}</span>`,document.getElementById('result').style.color='#4ade80',document.getElementById('result').style.textShadow='0 0 10px rgba(74, 222, 128, 0.4)',n&&(n.disabled=!1)},1600)}document.addEventListener("DOMContentLoaded",(()=>{createSnowfall(),initDice()}));</script></body></html>
